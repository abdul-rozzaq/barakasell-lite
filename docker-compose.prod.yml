# Production stack: pulls pre-built images (see .github/workflows/build-
# *.yaml) instead of building from source. Copy .env.example to .env and
# fill it in first — every variable here comes from it, no fallback
# values.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - barakasell_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    image: ${DOCKER_REGISTRY_NAME}/barakasell-lite-api:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PORT: ${API_PORT}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    ports:
      - "${API_PORT}:${API_PORT}"

  admin:
    build:
      context: ./apps/admin
    image: ${DOCKER_REGISTRY_NAME}/barakasell-lite-admin:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: ${ADMIN_PORT}
    ports:
      - "${ADMIN_PORT}:${ADMIN_PORT}"

  pos:
    build:
      context: ./apps/pos
    image: ${DOCKER_REGISTRY_NAME}/barakasell-lite-pos:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${POS_PORT}:3000"

volumes:
  barakasell_db_data:
